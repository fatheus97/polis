name: gitleaks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Config at .gitleaks.toml allowlists the FAKE secrets used as test fixtures
      # for Polis's own secret-detection (the Constitution).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
