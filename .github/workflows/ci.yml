name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure a git identity
        # The integration/worktree tests create real git repos and merges.
        run: |
          git config --global user.email "ci@polis.local"
          git config --global user.name "Polis CI"

      - name: Run the suite (stdlib unittest — no dependencies)
        run: python -m unittest discover -t . -s tests -v
