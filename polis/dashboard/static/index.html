<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polis · dashboard</title>
  <link rel="stylesheet" href="/static/pico.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- FEEDBACK_WIDGET_PLACEHOLDER -->
  <header class="topbar">
    <div class="brand">⚖&#xFE0E; <strong>Polis</strong> <span class="muted" id="base"></span></div>
    <div class="stats" id="stats"></div>
    <label class="live"><input type="checkbox" id="live" checked /> live</label>
  </header>

  <main class="grid">
    <section class="col left">
      <article class="panel">
        <header>Runs <span id="runcount" class="muted"></span></header>
        <div id="runs" class="runs"><p class="muted">No runs yet.</p></div>
      </article>

      <article class="panel">
        <header>Control panel</header>
        <div class="repo">
          <div class="muted" id="repoCurrent">target repo: …</div>
          <div class="row">
            <button type="button" id="browsePath" class="secondary">Browse…</button>
            <select id="repoBranchSelect" style="max-width:8rem" title="select branch">
              <option value="">— branch —</option>
            </select>
          </div>
          <!-- inline error + git-init offer; hidden until a non-git folder is chosen -->
          <div id="repoMsg" class="repo-msg" hidden></div>
          <!-- fallback only: revealed when no OS picker is available (204) -->
          <form id="repoForm" class="row" hidden>
            <input id="repoPath" hidden placeholder="path to the repo Polis develops" />
            <button type="submit" class="secondary">Set repo</button>
          </form>
        </div>
        <form id="budgetForm" class="row">
          <input type="number" id="budgetAmount" placeholder="fund amount" step="1" min="1" />
          <button type="submit">Fund</button>
        </form>
        <form id="feedbackForm">
          <textarea id="feedbackText" rows="2" placeholder="feedback for the architect…"></textarea>
          <div class="row">
            <input id="feedbackDirectives" placeholder='directives JSON (optional)' />
            <button type="submit">Submit</button>
          </div>
        </form>
        <form id="runForm" class="run-row">
          <label class="chk" title="architects (panel size)">arch
            <input type="number" id="runArchitects" value="1" min="1" /></label>
          <label class="chk" title="Constitutional Court (reviews the Architect&#39;s PRDs)"><input type="checkbox" id="runCourt" /> Constitutional Court</label>
          <button type="submit" title="process the oldest pending ticket">Run next</button>
        </form>
        <div class="flags row" id="cfgFlags">
          <label class="chk" title="show the feedback widget in this app"><input type="checkbox" id="cfgTesting" /> testing</label>
          <label class="chk" title="distill reports into tickets (the Clerk)"><input type="checkbox" id="cfgTicketizer" /> clerk</label>
          <label class="chk" title="auto-start a run for each distilled ticket"><input type="checkbox" id="cfgAutoRun" /> auto-run</label>
        </div>
        <p class="muted" style="font-size:.72rem;margin:.1rem 0 .4rem">
          “Run next”, or open a report and click <b>▶ Run this ticket</b>. Runs use real agents by
          default; switch to free stubs with <code>config --real-runs off</code>.</p>
        <div id="jobs" class="jobs"></div>
      </article>
    </section>

    <section class="col right">
      <article class="panel" id="detailPanel">
        <header id="detailHeader">Select a run to see its timeline</header>
        <div id="detail"></div>
      </article>

      <article class="panel">
        <header>Activity feed</header>
        <div id="feed" class="feed"></div>
      </article>

      <article class="panel">
        <header>Tester reports <span id="reportcount" class="muted"></span></header>
        <div id="reports" class="reports"><p class="muted">No reports yet.</p></div>
      </article>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
