[project]
name = "polis"
version = "0.3.0"
description = "A separation-of-powers multi-agent coding system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Phase 0 is intentionally stdlib-only (sqlite3, json, argparse, unittest) so the
# skeleton runs and tests pass with zero `pip install`. Real-LLM / coding-agent
# integration in later phases will add dependencies here.
dependencies = []

# The web dashboard is an OPTIONAL extra so the core stays standard-library only.
# Install with:  pip install -e '.[dashboard]'
[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
polis = "polis.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["polis", "polis.agents", "polis.dashboard"]

[tool.setuptools.package-data]
"polis.dashboard" = ["static/*"]
